<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Profile</title>

  <style>
    /* =========================
       SECURITY & PANIC STYLES
    ========================== */
    
    /* Default state: hide the full-screen CSS panic warning */
    body::before, body::after {
      display: none !important;
    }

    /* Activated state: when .security-panic class is added to body */
    body.security-panic #content {
      display: none !important;
    }

    /* Background overlay */
    body.security-panic::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff4d4d, #b30000);
      z-index: 999998;
      display: block !important;
    }

    /* Warning message text */
    body.security-panic::after {
      content:
        "⚠ Developer Tools Detected\a\a"
        "Hi there! This system is intended for authorized personnel only.\a"
        "Please avoid inspecting or modifying the application.\a\a"
        "Unauthorized access may violate company security policies.";

      white-space: pre-line;
      position: fixed;
      inset: 0;
      display: flex !important;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: white;
      text-align: center;
      font-size: 24px;
      line-height: 1.8;
      font-family: Arial, sans-serif;
      font-weight: bold;
      z-index: 999999;
      animation: warningFade 0.25s ease;
    }

    /* Separate Inline HTML warning element (Hidden by default) */
    #inspect-warning {
      display: none;
    }

    @keyframes warningFade {
      from { opacity: 0; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }

    /* =========================
       LOADING SCREEN
    ========================== */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loader img {
      width: 260px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }

    .loading-text {
      color: #1e88e5;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* =========================
       CONTENT & LAYOUT
    ========================== */
    body {
      background-color: #f4f7f6;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    #content {
      display: none;
      padding: 20px;
      transition: filter 0.2s ease; /* Smooth transition for the blur effect */
    }

    .card {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }

    h1 {
      color: #1e88e5;
      margin-bottom: 20px;
    }

    .row {
      margin: 12px 0;
      font-size: 16px;
    }

    .label {
      font-weight: bold;
      display: inline-block;
      min-width: 120px;
    }

    .error {
      color: #c62828;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .muted {
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="loader">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="INLAND Logo">
    <div class="loading-text">Loading Employee Profile...</div>
  </div>

  <div id="content">
    <? if (employee) { ?>
      <div class="card">
        <h1><?= employee.name ?></h1>
        <div class="row"><span class="label">ID:</span> <?= employee.id ?></div>
        <div class="row"><span class="label">Position:</span> <?= employee.position ?></div>
        <div class="row"><span class="label">Department:</span> <?= employee.department ?></div>
      </div>
    <? } else { ?>
      <div class="card">
        <div class="error">Employee Not Found</div>
        <div class="muted">Requested ID: <?= requestedId ? requestedId : "None Provided" ?></div>
      </div>
    <? } ?>
  </div>

  <script>
    // FIX: Defined the missing configuration constants global variables
    const MAIN_CONTENT_ID = 'content';
    const PANIC_CLASS = 'security-panic';

    function setupPrivacyListeners() {
      const applyBlur = () => {
        const mainContent = document.getElementById(MAIN_CONTENT_ID);
        if (mainContent) {
          mainContent.style.filter = 'blur(40px) grayscale(100%)';
        }
      };

      const removeBlur = () => {
        const mainContent = document.getElementById(MAIN_CONTENT_ID);
        if (mainContent) {
          mainContent.style.filter = 'none';
        }
      };

      const activatePanicMode = () => {
        document.body.classList.add(PANIC_CLASS);
        document.body.style.overflow = 'hidden';
        document.title = 'Access Restricted';
      };

      // Blur page when window tab loses focus
      window.addEventListener('blur', applyBlur);
      window.addEventListener('focus', removeBlur);

      document.addEventListener('visibilitychange', () => {
        document.hidden ? applyBlur() : removeBlur();
      });

      // Detect DevTools by window size discrepancies
      setInterval(() => {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (!isMobile && (widthThreshold || heightThreshold)) {
          activatePanicMode();
        }
      }, 1000);

      // Block inspect shortcuts
      document.addEventListener('keydown', (e) => {
        const blocked =
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
          (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()));

        if (blocked) {
          e.preventDefault();
          e.stopPropagation();
          activatePanicMode();
          return false;
        }
      });

      // Disable right-click menu
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        activatePanicMode();
      });
    }

    // Initialize logic on window load
    window.addEventListener('load', function() {
      // Run privacy protections
      setupPrivacyListeners();

      // Hand off loader presentation screen
      setTimeout(function() {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            loader.style.display = 'none';
            document.getElementById('content').style.display = 'block';
          }, 500);
        }
      }, 1800);
    });
  </script>

</body>
</html>
